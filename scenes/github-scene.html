<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>GitHub Explorer — Collaborative VR</title>
    <meta name="description" content="Immersive collaborative GitHub repository analysis with BabiaXR charts in VR">
    <link rel="icon" type="image/png" href="../assets/images/MiLogoVR.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- WORKAROUND: Remove built-in A-Frame 1.5+ grabbable to avoid
         conflict with superhands' grabbable component -->
    <script>delete AFRAME.components["grabbable"];</script>

    <!-- Networking -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/easyrtc/easyrtc.js"></script>
    <script src="/js/networked-aframe.js"></script>
    <script src="/js/easyrtc-patch.js"></script>

    <!-- BabiaXR -->
    <script src="https://unpkg.com/aframe-babia-components/dist/aframe-babia-components.min.js"></script>

    <!-- A-Frame extras (sphere-collider, etc.) -->
    <script
        src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <!-- Superhands — Natural VR interaction -->
    <script src="https://unpkg.com/super-hands@^3.0.6/dist/super-hands.min.js"></script>

    <link rel="stylesheet" href="../css/github-scene.css">
</head>

<body>

    <!-- ══════════════════════════════════════════
         LOADING OVERLAY
         ══════════════════════════════════════════ -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Fetching repository data…</div>
        <div class="loading-repo" id="loading-repo-name"></div>
    </div>

    <!-- ══════════════════════════════════════════
         REPO INFO PANEL (HUD — top left)
         ══════════════════════════════════════════ -->
    <div id="repo-hud" class="hidden">
        <div class="hud-eyebrow">GitHub Explorer</div>
        <div class="hud-repo-name" id="hud-repo-name">Loading...</div>
        <div class="hud-desc" id="hud-desc">Fetching repository data...</div>
        <div class="hud-stats">
            <div class="hud-stat">
                <div class="hud-stat-value" id="hud-stars">—</div>
                <div class="hud-stat-label">Stars</div>
            </div>
            <div class="hud-stat">
                <div class="hud-stat-value" id="hud-forks">—</div>
                <div class="hud-stat-label">Forks</div>
            </div>
            <div class="hud-stat">
                <div class="hud-stat-value" id="hud-issues">—</div>
                <div class="hud-stat-label">Issues</div>
            </div>
            <div class="hud-stat">
                <div class="hud-stat-value" id="hud-lang">—</div>
                <div class="hud-stat-label">Language</div>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════
         SESSION BADGE (HUD — top right)
         ══════════════════════════════════════════ -->
    <div id="session-badge">
        <div class="badge-room" id="badge-room">—</div>
        <div class="badge-time" id="badge-time">--:--</div>
        <div class="badge-date" id="badge-date">Loading...</div>
        <div class="badge-session">
            <span class="session-dot"></span>
            Session: <span id="badge-session">0:00</span>
        </div>
    </div>

    <!-- ══════════════════════════════════════════
         DASHBOARD TOGGLE BUTTON
         ══════════════════════════════════════════ -->
    <button id="dashboard-toggle" class="dashboard-toggle" title="Toggle statistics panel">
        <svg class="toggle-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round">
            <rect x="1" y="9" width="3" height="6" rx="0.5" />
            <rect x="6.5" y="5" width="3" height="10" rx="0.5" />
            <rect x="12" y="1" width="3" height="14" rx="0.5" />
        </svg>
        <span class="toggle-label">Stats</span>
    </button>

    <!-- ══════════════════════════════════════════
         DATA DASHBOARD — Right side panel
         ══════════════════════════════════════════ -->
    <div id="data-dashboard" class="hidden dash-collapsed">
        <!-- Dashboard Header -->
        <div class="dash-header">
            <span class="dash-header-title">Repository Stats</span>
            <button id="dashboard-close" class="dash-close-btn" title="Close panel">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round">
                    <line x1="3" y1="3" x2="11" y2="11" />
                    <line x1="11" y1="3" x2="3" y2="11" />
                </svg>
            </button>
        </div>

        <!-- Languages Breakdown -->
        <div class="dash-section">
            <div class="dash-section-header">
                <span class="dash-icon">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4.5,1.5 1,7 4.5,12.5" />
                        <polyline points="9.5,1.5 13,7 9.5,12.5" />
                    </svg>
                </span>
                <span class="dash-title">Languages</span>
            </div>
            <div id="dash-languages" class="dash-lang-list">
                <div class="dash-placeholder">Loading…</div>
            </div>
        </div>

        <!-- Top Contributors -->
        <div class="dash-section">
            <div class="dash-section-header">
                <span class="dash-icon">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="5" cy="4" r="2.2" />
                        <path d="M1,13 C1,10.2 2.8,8 5,8 C7.2,8 9,10.2 9,13" />
                        <circle cx="10.5" cy="4.5" r="1.7" />
                        <path d="M10.5,8.5 C12,8.5 13,10 13,12" />
                    </svg>
                </span>
                <span class="dash-title">Top Contributors</span>
            </div>
            <div id="dash-contributors" class="dash-contrib-list">
                <div class="dash-placeholder">Loading…</div>
            </div>
        </div>

        <!-- Key Metrics -->
        <div class="dash-section">
            <div class="dash-section-header">
                <span class="dash-icon">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1,11 4.5,7 7.5,9 13,3" />
                        <polyline points="9,3 13,3 13,7" />
                    </svg>
                </span>
                <span class="dash-title">Metrics</span>
            </div>
            <div id="dash-metrics" class="dash-metrics-grid">
                <div class="dash-placeholder">Loading…</div>
            </div>
        </div>
    </div>

    <!-- Back to Lobby -->
    <a id="back-lobby" href="javascript:void(0)">
        ← Back to Lobby
    </a>

    <!-- ══════════════════════════════════════════
         A-FRAME SCENE
         ══════════════════════════════════════════ -->
    <a-scene id="github-scene">

        <a-assets>
            <!-- Avatar template -->
            <template id="avatar-template">
                <a-entity class="avatar">
                    <a-entity class="player-cam" networked-audio-source>
                        <a-entity class="visual-model"
                            animation="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true; to: 0 0.1 0">
                            <a-sphere class="head" scale="0.3 0.3 0.3"></a-sphere>
                            <a-entity class="face" position="0 0.05 0">
                                <a-sphere class="eye" color="#efefef" position="0.1 0.1 -0.2" scale="0.08 0.08 0.08">
                                    <a-sphere class="pupil" color="#000" position="0 0 -1"
                                        scale="0.2 0.2 0.2"></a-sphere>
                                </a-sphere>
                                <a-sphere class="eye" color="#efefef" position="-0.1 0.1 -0.2" scale="0.08 0.08 0.08">
                                    <a-sphere class="pupil" color="#000" position="0 0 -1"
                                        scale="0.2 0.2 0.2"></a-sphere>
                                </a-sphere>
                            </a-entity>
                        </a-entity>
                        <a-entity class="nametag-container" position="0 0.6 0" look-at="[camera]">
                            <a-text class="nametag" value="Anonymous" color="white" align="center" scale="1.5 1.5 1.5"
                                side="double"></a-text>
                        </a-entity>
                    </a-entity>
                </a-entity>
            </template>
        </a-assets>

        <!-- ==================== ENVIRONMENT ==================== -->

        <!-- Sky & Ground — Dark Developer Aesthetic -->
        <a-sky color="#0f172a"></a-sky>
        <a-plane position="0 -0.02 0" rotation="-90 0 0" width="200" height="200"
            material="shader: flat; color: #1e293b; opacity: 1; transparent: false; side: double">
        </a-plane>

        <!-- Grid Lines (generated by JS) -->
        <a-entity id="grid-lines"></a-entity>

        <!-- Central Platform -->
        <a-cylinder position="0 -0.01 0" radius="25" height="0.02"
            material="color: #0f172a; roughness: 0.9; metalness: 0"></a-cylinder>
        <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="24.6" radius-outer="25.2"
            material="color: #059669; opacity: 0.15; transparent: true"></a-ring>
        <!-- Inner decorative rings -->
        <a-ring position="0 0.005 0" rotation="-90 0 0" radius-inner="12" radius-outer="12.1"
            material="color: #059669; opacity: 0.08; transparent: true"></a-ring>
        <a-ring position="0 0.005 0" rotation="-90 0 0" radius-inner="18" radius-outer="18.08"
            material="color: #059669; opacity: 0.06; transparent: true"></a-ring>

        <!-- ==================== LIGHTING ==================== -->

        <!-- Ambient & Directional -->
        <a-light type="ambient" intensity="0.65" color="#e2e8f0"></a-light>
        <a-light type="directional" intensity="0.4" position="5 20 10" color="#ffffff" castShadow="false"></a-light>

        <!-- Accent Spots for the 3 Exhibits -->
        <a-light type="spot" intensity="0.7" color="#059669" position="0 14 -14" target="#exhibit-languages" angle="40"
            penumbra="1" distance="28" decay="1.2"></a-light>
        <a-light type="spot" intensity="0.7" color="#059669" position="-14 14 8" target="#exhibit-contributors"
            angle="40" penumbra="1" distance="28" decay="1.2"></a-light>
        <a-light type="spot" intensity="0.7" color="#059669" position="14 14 8" target="#exhibit-metrics" angle="40"
            penumbra="1" distance="28" decay="1.2"></a-light>

        <!-- ==================== DATA SOURCES ==================== -->
        <!-- These will have their `url` set dynamically by JS once roomId is known -->
        <a-entity id="languages-data"></a-entity>
        <a-entity id="contributors-data"></a-entity>
        <a-entity id="summary-data"></a-entity>

        <!-- ==================== EXHIBIT 1: LANGUAGES (Center-front) ==================== -->
        <a-entity id="exhibit-languages" position="0 0 -14">
            <!-- Pedestal -->
            <a-cylinder position="0 0.4 0" radius="8.5" height="0.8"
                material="color: #1e293b; opacity: 0.95"></a-cylinder>
            <a-cylinder position="0 0.81 0" radius="8.3" height="0.02"
                material="color: #059669; opacity: 0.2; transparent: true"></a-cylinder>
            <!-- Glow ring -->
            <a-ring position="0 0.015 0" rotation="-90 0 0" radius-inner="8.4" radius-outer="8.8"
                material="color: #059669; emissive: #059669; emissiveIntensity: 0.3; opacity: 0.1; transparent: true; side: double"
                animation="property: material.opacity; from: 0.06; to: 0.14; dir: alternate; dur: 3000; easing: easeInOutSine; loop: true"></a-ring>

            <!-- Floating Labels -->
            <a-text value="Repository Languages" position="0 1.6 8.8" rotation="-15 0 0" align="center" color="#f1f5f9"
                width="8" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" opacity="0.9"></a-text>
            <a-text value="Distribution by Percentage" position="0 1.2 8.8" rotation="-15 0 0" align="center"
                color="#94a3b8" width="6" opacity="0.8"></a-text>

            <!-- Chart Wrapper (hoverable, grabbable) -->
            <a-entity id="chart-langs-wrapper" position="0 0.82 0" hoverable grabbable stretchable draggable hover-glow
                grab-visual chart-sync="syncId: gh-langs" ownership-lock>
                <a-box class="sh-hitbox" position="0 -0.25 0" width="17" height="0.5" depth="17"
                    material="opacity: 0; transparent: true; side: double"></a-box>
                <a-entity id="chart-langs" scale="0.01 0.01 0.01"
                    animation="property: scale; from: 0 0 0; to: 0.5 0.5 0.5; dur: 1200; easing: easeOutElastic; delay: 400">
                </a-entity>
            </a-entity>

            <!-- Metric Plaque -->
            <a-entity id="metric-languages" position="0 0.4 5.6" hoverable grabbable hover-glow grab-visual
                chart-sync="syncId: metric-langs" ownership-lock
                animation="property: position; to: 0 0.42 5.6; dir: alternate; dur: 4000; easing: easeInOutSine; loop: true">
                <a-box class="sh-hitbox" width="2.4" height="1" depth="0.1"
                    material="opacity: 0; transparent: true; side: double"></a-box>
                <a-plane width="2.2" height="0.85"
                    material="color: #1e293b; opacity: 0.92; transparent: true"></a-plane>
                <a-plane width="2.22" height="0.87" position="0 0 -0.001"
                    material="color: #059669; opacity: 0.15; transparent: true"></a-plane>
                <a-text value="Total Languages" position="0 0.16 0.01" align="center" color="#94a3b8"
                    width="2.8"></a-text>
                <a-text id="metric-langs-value" value="—" position="0 -0.12 0.01" align="center" color="#34d399"
                    width="4" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
            </a-entity>

            <!-- 3D Info Panel Toggle -->
            <a-entity id="info-toggle-langs" class="info-toggle-3d" position="7 1.8 7"
                info-panel-toggle="panel: #info-panel-langs"
                animation="property: position; to: 7 2.0 7; dir: alternate; dur: 3000; easing: easeInOutSine; loop: true">
                <!-- Invisible Hitbox for Raycaster -->
                <a-cylinder class="sh-hitbox" radius="0.4" height="0.2" rotation="90 0 0"
                    material="opacity: 0; transparent: true"></a-cylinder>

                <a-cylinder radius="0.3" height="0.06" rotation="90 0 0"
                    material="color: #1e293b; opacity: 0.92; transparent: true; side: double"></a-cylinder>
                <a-ring radius-inner="0.22" radius-outer="0.3" rotation="90 0 0" position="0 0 0.001"
                    material="color: #059669; opacity: 0.3; transparent: true; side: double"
                    animation="property: material.opacity; from: 0.2; to: 0.5; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true"></a-ring>
                <a-text value="i" position="0 0.02 0.04" rotation="0 0 0" align="center" color="#34d399" width="2.5"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" side="double"></a-text>
            </a-entity>

            <!-- 3D Info Panel (hidden by default) -->
            <a-entity id="info-panel-langs" position="5.5 3 5" rotation="0 -30 0" visible="false" look-at="[camera]">
                <a-plane width="4.5" height="2.2"
                    material="color: #0f172a; opacity: 0.93; transparent: true; side: double"></a-plane>
                <a-plane width="4.52" height="2.22" position="0 0 -0.002"
                    material="color: #059669; opacity: 0.12; transparent: true; side: double"></a-plane>
                <a-plane width="0.04" height="1.8" position="-2.1 0 0.003"
                    material="color: #059669; opacity: 0.6; transparent: true; side: double"></a-plane>
                <a-text value="Languages Chart" position="0 0.7 0.01" align="center" color="#34d399" width="4"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
                <a-text
                    value="Shows the distribution of programming\nlanguages in this repository by bytes\nof source code. Each bar represents a\nlanguage; height is proportional to\nthe amount of code written in it."
                    position="0 0 0.01" align="center" color="#94a3b8" width="3.6" baseline="center"
                    wrap-count="42"></a-text>
                <a-text value="Drag to move  |  Pinch to resize" position="0 -0.85 0.01" align="center" color="#64748b"
                    width="2.8"></a-text>
            </a-entity>
        </a-entity>

        <!-- ==================== EXHIBIT 2: CONTRIBUTORS (Left, rotated 120°) ==================== -->
        <a-entity id="exhibit-contributors" position="-14 0 8" rotation="0 120 0" scale="0.5 0.5 0.5">
            <!-- Pedestal -->
            <a-cylinder position="0 0.4 0" radius="7.5" height="0.8"
                material="color: #1e293b; opacity: 0.95"></a-cylinder>
            <a-cylinder position="0 0.81 0" radius="7.3" height="0.02"
                material="color: #059669; opacity: 0.2; transparent: true"></a-cylinder>
            <!-- Glow ring -->
            <a-ring position="0 0.015 0" rotation="-90 0 0" radius-inner="7.4" radius-outer="7.8"
                material="color: #059669; emissive: #059669; emissiveIntensity: 0.3; opacity: 0.1; transparent: true; side: double"
                animation="property: material.opacity; from: 0.06; to: 0.14; dir: alternate; dur: 3500; easing: easeInOutSine; loop: true"></a-ring>

            <!-- Floating Labels -->
            <a-text value="Top Contributors" position="0 1.6 7.8" rotation="-15 0 0" align="center" color="#f1f5f9"
                width="8" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" opacity="0.9"></a-text>
            <a-text value="Commit Distribution" position="0 1.2 7.8" rotation="-15 0 0" align="center" color="#94a3b8"
                width="6" opacity="0.8"></a-text>

            <!-- Chart Wrapper -->
            <a-entity id="chart-contribs-wrapper" position="0 4 0" hoverable grabbable stretchable draggable hover-glow
                grab-visual chart-sync="syncId: gh-contribs" ownership-lock>
                <a-box class="sh-hitbox" position="0 -1.8 0" width="15" height="0.5" depth="15"
                    material="opacity: 0; transparent: true; side: double"></a-box>
                <a-entity id="chart-contribs" rotation="90 0 0" scale="0.01 0.01 0.01"
                    animation="property: scale; from: 0 0 0; to: 3.0 3.0 3.0; dur: 1000; easing: easeOutElastic; delay: 700">
                </a-entity>
            </a-entity>

            <!-- Metric Plaque -->
            <a-entity id="metric-contributors" position="0 0.4 4.6" hoverable grabbable hover-glow grab-visual
                chart-sync="syncId: metric-contribs" ownership-lock
                animation="property: position; to: 0 0.42 4.6; dir: alternate; dur: 3500; easing: easeInOutSine; loop: true">
                <a-box class="sh-hitbox" width="2.4" height="1" depth="0.1"
                    material="opacity: 0; transparent: true; side: double"></a-box>
                <a-plane width="2.2" height="0.85"
                    material="color: #1e293b; opacity: 0.92; transparent: true"></a-plane>
                <a-plane width="2.22" height="0.87" position="0 0 -0.001"
                    material="color: #059669; opacity: 0.15; transparent: true"></a-plane>
                <a-text value="Contributors" position="0 0.16 0.01" align="center" color="#94a3b8" width="2.8"></a-text>
                <a-text id="metric-contribs-value" value="—" position="0 -0.12 0.01" align="center" color="#34d399"
                    width="4" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
            </a-entity>

            <!-- 3D Info Panel Toggle -->
            <a-entity id="info-toggle-contribs" class="info-toggle-3d" position="6 1.8 6"
                info-panel-toggle="panel: #info-panel-contribs"
                animation="property: position; to: 6 2.0 6; dir: alternate; dur: 3500; easing: easeInOutSine; loop: true">
                <!-- Invisible Hitbox for Raycaster -->
                <a-cylinder class="sh-hitbox" radius="0.4" height="0.2" rotation="90 0 0"
                    material="opacity: 0; transparent: true"></a-cylinder>

                <a-cylinder radius="0.3" height="0.06" rotation="90 0 0"
                    material="color: #1e293b; opacity: 0.92; transparent: true; side: double"></a-cylinder>
                <a-ring radius-inner="0.22" radius-outer="0.3" rotation="90 0 0" position="0 0 0.001"
                    material="color: #059669; opacity: 0.3; transparent: true; side: double"
                    animation="property: material.opacity; from: 0.2; to: 0.5; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true"></a-ring>
                <a-text value="i" position="0 0.02 0.04" rotation="0 0 0" align="center" color="#34d399" width="2.5"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" side="double"></a-text>
            </a-entity>

            <!-- 3D Info Panel (hidden by default) -->
            <a-entity id="info-panel-contribs" position="5 3 4" rotation="0 -25 0" visible="false" look-at="[camera]">
                <a-plane width="4.5" height="2.2"
                    material="color: #0f172a; opacity: 0.93; transparent: true; side: double"></a-plane>
                <a-plane width="4.52" height="2.22" position="0 0 -0.002"
                    material="color: #059669; opacity: 0.12; transparent: true; side: double"></a-plane>
                <a-plane width="0.04" height="1.8" position="-2.1 0 0.003"
                    material="color: #059669; opacity: 0.6; transparent: true; side: double"></a-plane>
                <a-text value="Contributors Chart" position="0 0.7 0.01" align="center" color="#34d399" width="4"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
                <a-text
                    value="Displays the top contributors ranked\nby number of commits. The pie chart\nshows each contributor's share of\ntotal commits. Point at slices in\nVR for individual statistics."
                    position="0 0 0.01" align="center" color="#94a3b8" width="3.6" baseline="center"
                    wrap-count="42"></a-text>
                <a-text value="Drag to move  |  Pinch to resize" position="0 -0.85 0.01" align="center" color="#64748b"
                    width="2.8"></a-text>
            </a-entity>
        </a-entity>

        <!-- ==================== EXHIBIT 3: METRICS (Right, rotated -120°) ==================== -->
        <a-entity id="exhibit-metrics" position="14 0 8" rotation="0 -120 0">
            <!-- Pedestal -->
            <a-cylinder position="0 0.4 0" radius="7.5" height="0.8"
                material="color: #1e293b; opacity: 0.95"></a-cylinder>
            <a-cylinder position="0 0.81 0" radius="7.3" height="0.02"
                material="color: #059669; opacity: 0.2; transparent: true"></a-cylinder>
            <!-- Glow ring -->
            <a-ring position="0 0.015 0" rotation="-90 0 0" radius-inner="7.4" radius-outer="7.8"
                material="color: #059669; emissive: #059669; emissiveIntensity: 0.3; opacity: 0.1; transparent: true; side: double"
                animation="property: material.opacity; from: 0.06; to: 0.14; dir: alternate; dur: 4000; easing: easeInOutSine; loop: true"></a-ring>

            <!-- Floating Labels -->
            <a-text value="Repository Metrics" position="0 1.6 7.8" rotation="-15 0 0" align="center" color="#f1f5f9"
                width="8" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" opacity="0.9"></a-text>
            <a-text value="Overview Stats" position="0 1.2 7.8" rotation="-15 0 0" align="center" color="#94a3b8"
                width="6" opacity="0.8"></a-text>

            <!-- Chart Wrapper -->
            <a-entity id="chart-metrics-wrapper" position="0 0.82 0" hoverable grabbable stretchable draggable
                hover-glow grab-visual chart-sync="syncId: gh-metrics" ownership-lock>
                <a-box class="sh-hitbox" position="0 -0.25 0" width="15" height="0.5" depth="15"
                    material="opacity: 0; transparent: true; side: double"></a-box>
                <a-entity id="chart-metrics" scale="0.01 0.01 0.01"
                    animation="property: scale; from: 0 0 0; to: 0.1 0.1 0.1; dur: 1000; easing: easeOutElastic; delay: 1000">
                </a-entity>
            </a-entity>

            <!-- Metric Plaque -->
            <a-entity id="metric-summary" position="0 0.4 4.6" hoverable grabbable hover-glow grab-visual
                chart-sync="syncId: metric-summary" ownership-lock
                animation="property: position; to: 0 0.42 4.6; dir: alternate; dur: 4500; easing: easeInOutSine; loop: true">
                <a-box class="sh-hitbox" width="2.4" height="1" depth="0.1"
                    material="opacity: 0; transparent: true; side: double"></a-box>
                <a-plane width="2.2" height="0.85"
                    material="color: #1e293b; opacity: 0.92; transparent: true"></a-plane>
                <a-plane width="2.22" height="0.87" position="0 0 -0.001"
                    material="color: #059669; opacity: 0.15; transparent: true"></a-plane>
                <a-text value="Total Stars" position="0 0.16 0.01" align="center" color="#94a3b8" width="2.8"></a-text>
                <a-text id="metric-stars-value" value="—" position="0 -0.12 0.01" align="center" color="#34d399"
                    width="4" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
            </a-entity>

            <!-- 3D Info Panel Toggle -->
            <a-entity id="info-toggle-metrics" class="info-toggle-3d" position="6 1.8 6"
                info-panel-toggle="panel: #info-panel-metrics"
                animation="property: position; to: 6 2.0 6; dir: alternate; dur: 4000; easing: easeInOutSine; loop: true">
                <!-- Invisible Hitbox for Raycaster -->
                <a-cylinder class="sh-hitbox" radius="0.4" height="0.2" rotation="90 0 0"
                    material="opacity: 0; transparent: true"></a-cylinder>

                <a-cylinder radius="0.3" height="0.06" rotation="90 0 0"
                    material="color: #1e293b; opacity: 0.92; transparent: true; side: double"></a-cylinder>
                <a-ring radius-inner="0.22" radius-outer="0.3" rotation="90 0 0" position="0 0 0.001"
                    material="color: #059669; opacity: 0.3; transparent: true; side: double"
                    animation="property: material.opacity; from: 0.2; to: 0.5; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true"></a-ring>
                <a-text value="i" position="0 0.02 0.04" rotation="0 0 0" align="center" color="#34d399" width="2.5"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" side="double"></a-text>
            </a-entity>

            <!-- 3D Info Panel (hidden by default) -->
            <a-entity id="info-panel-metrics" position="5 3 4" rotation="0 -25 0" visible="false" look-at="[camera]">
                <a-plane width="4.5" height="2.2"
                    material="color: #0f172a; opacity: 0.93; transparent: true; side: double"></a-plane>
                <a-plane width="4.52" height="2.22" position="0 0 -0.002"
                    material="color: #059669; opacity: 0.12; transparent: true; side: double"></a-plane>
                <a-plane width="0.04" height="1.8" position="-2.1 0 0.003"
                    material="color: #059669; opacity: 0.6; transparent: true; side: double"></a-plane>
                <a-text value="Metrics Chart" position="0 0.7 0.01" align="center" color="#34d399" width="4"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
                <a-text
                    value="Key health indicators: stars (community\ninterest), forks (derivative projects),\nopen issues (pending work), contributors,\nrepository size, and language count.\nBars allow quick visual comparison."
                    position="0 0 0.01" align="center" color="#94a3b8" width="3.6" baseline="center"
                    wrap-count="42"></a-text>
                <a-text value="Drag to move  |  Pinch to resize" position="0 -0.85 0.01" align="center" color="#64748b"
                    width="2.8"></a-text>
            </a-entity>
        </a-entity>

        <!-- ==================== 3D WELCOME & REPO TITLE ==================== -->
        <a-entity id="scene-title" position="0 8 -14">
            <a-text value="GitHub Explorer" position="0 0.9 0" align="center" color="#059669" width="14"
                font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" opacity="0.8"></a-text>
            <a-text id="scene-repo-name" value="" position="0 0.1 0" align="center" color="#f1f5f9" width="10"
                font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" opacity="0.9"></a-text>
            <a-text id="scene-clock-time" value="--:--" position="0 -0.5 0" align="center" color="#34d399" width="6"
                opacity="0.6"></a-text>
        </a-entity>

        <!-- ==================== FLOATING PARTICLES ==================== -->
        <a-entity id="floating-particles">
            <a-sphere position="-3 4 -8" radius="0.04"
                material="color: #34d399; emissive: #34d399; emissiveIntensity: 0.8; opacity: 0.6; transparent: true"
                animation="property: position; to: -3 5.5 -8; dir: alternate; dur: 5000; easing: easeInOutSine; loop: true"
                animation__fade="property: material.opacity; from: 0.3; to: 0.7; dir: alternate; dur: 3000; loop: true"></a-sphere>
            <a-sphere position="5 3.5 -10" radius="0.035"
                material="color: #059669; emissive: #059669; emissiveIntensity: 0.6; opacity: 0.5; transparent: true"
                animation="property: position; to: 5 5 -10; dir: alternate; dur: 6000; easing: easeInOutSine; loop: true"
                animation__fade="property: material.opacity; from: 0.2; to: 0.6; dir: alternate; dur: 4000; loop: true"></a-sphere>
            <a-sphere position="-8 5 -5" radius="0.05"
                material="color: #34d399; emissive: #34d399; emissiveIntensity: 0.7; opacity: 0.4; transparent: true"
                animation="property: position; to: -8 6.5 -5; dir: alternate; dur: 7000; easing: easeInOutSine; loop: true"
                animation__fade="property: material.opacity; from: 0.2; to: 0.5; dir: alternate; dur: 3500; loop: true"></a-sphere>
            <a-sphere position="7 4.5 -3" radius="0.03"
                material="color: #059669; emissive: #059669; emissiveIntensity: 0.9; opacity: 0.5; transparent: true"
                animation="property: position; to: 7 6 -3; dir: alternate; dur: 4500; easing: easeInOutSine; loop: true"
                animation__fade="property: material.opacity; from: 0.3; to: 0.6; dir: alternate; dur: 2800; loop: true"></a-sphere>
            <a-sphere position="-12 3 2" radius="0.045"
                material="color: #34d399; emissive: #34d399; emissiveIntensity: 0.7; opacity: 0.4; transparent: true"
                animation="property: position; to: -12 5 2; dir: alternate; dur: 5500; easing: easeInOutSine; loop: true"
                animation__fade="property: material.opacity; from: 0.2; to: 0.55; dir: alternate; dur: 3200; loop: true"></a-sphere>
            <a-sphere position="10 5 5" radius="0.04"
                material="color: #059669; emissive: #059669; emissiveIntensity: 0.8; opacity: 0.3; transparent: true"
                animation="property: position; to: 10 7 5; dir: alternate; dur: 6500; easing: easeInOutSine; loop: true"
                animation__fade="property: material.opacity; from: 0.15; to: 0.45; dir: alternate; dur: 4200; loop: true"></a-sphere>
            <a-sphere position="0 6 -6" radius="0.06"
                material="color: #34d399; emissive: #34d399; emissiveIntensity: 0.5; opacity: 0.3; transparent: true"
                animation="property: position; to: 0 7.5 -6; dir: alternate; dur: 8000; easing: easeInOutSine; loop: true"
                animation__fade="property: material.opacity; from: 0.15; to: 0.4; dir: alternate; dur: 5000; loop: true"></a-sphere>
            <a-sphere position="-6 3 -15" radius="0.035"
                material="color: #059669; emissive: #059669; emissiveIntensity: 0.9; opacity: 0.5; transparent: true"
                animation="property: position; to: -6 4.5 -15; dir: alternate; dur: 4000; easing: easeInOutSine; loop: true"
                animation__fade="property: material.opacity; from: 0.25; to: 0.6; dir: alternate; dur: 2500; loop: true"></a-sphere>
        </a-entity>

        <!-- ==================== CODE CITY — Software Visualization ==================== -->
        <a-entity id="code-city" position="0 0.03 0">
            <!-- Buildings and districts are generated dynamically by js/code-city.js -->
        </a-entity>


        <!-- ==================== PLAYER RIG ==================== -->
        <a-entity id="rig" networked="template:#avatar-template;attachTemplateToLocal:false;" position="0 0 5"
            spawn-in-circle="radius:3" player-info pointer-sync>

            <a-entity id="player" class="player-cam" camera position="0 1.6 0" wasd-controls="fly: true"
                look-controls="pointerLockEnabled: false">
                <!-- Desktop cursor -->
                <a-cursor raycaster="objects: .babia-bar, .babia-slice, .babia-cyl, .sh-hitbox" color="#059669"
                    fuse="false"></a-cursor>
                <a-sphere class="head" visible="false" random-color></a-sphere>
                <a-text class="nametag" visible="false"></a-text>
            </a-entity>

            <!-- ══════ VR CONTROLLERS — Superhands + Laser Pointer ══════ -->

            <!-- Left Controller: Locomotion (thumbstick) + Grab (trigger/grip) -->
            <a-entity id="left-controller" laser-controls="hand: left; model: true"
                cursor="fuse: false; rayOrigin: entity;"
                raycaster="objects: .sh-hitbox, .babia-bar, .babia-slice, .babia-cyl; far: 15; showLine: true; lineColor: #059669; lineOpacity: 0.35"
                super-hands="colliderEvent: raycaster-intersection;
                             colliderEventProperty: els;
                             colliderEndEvent: raycaster-intersection-cleared;
                             colliderEndEventProperty: clearedEls;
                             grabStartButtons: selectstart,triggerdown,gripdown;
                             grabEndButtons: selectend,triggerup,gripup;
                             stretchStartButtons: selectstart,triggerdown,gripdown;
                             stretchEndButtons: selectend,triggerup,gripup;
                             dragDropStartButtons: selectstart,triggerdown,gripdown;
                             dragDropEndButtons: selectend,triggerup,gripup" thumbstick-move="speed: 2.5">
            </a-entity>

            <!-- Right Controller: Snap Turn (thumbstick) + Grab (trigger/grip) -->
            <a-entity id="right-controller" laser-controls="hand: right; model: true"
                cursor="fuse: false; rayOrigin: entity;"
                raycaster="objects: .sh-hitbox, .babia-bar, .babia-slice, .babia-cyl; far: 15; showLine: true; lineColor: #059669; lineOpacity: 0.35"
                super-hands="colliderEvent: raycaster-intersection;
                             colliderEventProperty: els;
                             colliderEndEvent: raycaster-intersection-cleared;
                             colliderEndEventProperty: clearedEls;
                             grabStartButtons: selectstart,triggerdown,gripdown;
                             grabEndButtons: selectend,triggerup,gripup;
                             stretchStartButtons: selectstart,triggerdown,gripdown;
                             stretchEndButtons: selectend,triggerup,gripup;
                             dragDropStartButtons: selectstart,triggerdown,gripdown;
                             dragDropEndButtons: selectend,triggerup,gripup" thumbstick-turn="snapAngle: 45">
            </a-entity>

            <!-- ══════ HAND TRACKING FALLBACK (Quest 3 bare hands) ══════ -->

            <a-entity id="left-hand-tracking"
                hand-tracking-controls="hand: left; modelColor: #059669; modelOpacity: 0.3"
                sphere-collider="objects: .sh-hitbox; radius: 0.04" super-hands>
            </a-entity>

            <a-entity id="right-hand-tracking"
                hand-tracking-controls="hand: right; modelColor: #059669; modelOpacity: 0.3"
                sphere-collider="objects: .sh-hitbox; radius: 0.04" super-hands>
            </a-entity>

        </a-entity>

    </a-scene>

    <!-- Scene Logic -->
    <script src="/js/code-city.js"></script>
    <script src="/js/github-scene-logic.js"></script>

</body>

</html>
