<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Zen Archipelago — Immersive Data Explorer</title>
    <meta name="description"
        content="An immersive VR data exploration experience set in a serene zen garden archipelago">
    <link rel="icon" type="image/png" href="assets/images/MiLogoVR.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- A-Frame extras (ocean, movement, etc.) -->
    <script
        src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

    <link rel="stylesheet" href="css/scenenew.css">

    <script>
        // ═══════════════════════════════════════════════════════════
        //  ZEN ARCHIPELAGO — Custom A-Frame Components
        // ═══════════════════════════════════════════════════════════

        // ── Gentle floating animation (organic, non-mechanical) ──
        AFRAME.registerComponent('zen-float', {
            schema: {
                amplitude: { type: 'number', default: 0.15 },
                speed: { type: 'number', default: 1 },
                phase: { type: 'number', default: 0 }
            },
            init: function () {
                this.startY = this.el.object3D.position.y;
                this.time = this.data.phase;
            },
            tick: function (t, dt) {
                this.time += (dt / 1000) * this.data.speed;
                var y = this.startY + Math.sin(this.time) * this.data.amplitude;
                this.el.object3D.position.y = y;
            }
        });

        // ── Slow organic rotation ──
        AFRAME.registerComponent('zen-rotate', {
            schema: {
                speed: { type: 'number', default: 0.02 },
                axis: { type: 'string', default: 'y' }
            },
            tick: function (t, dt) {
                var deg = (dt / 1000) * this.data.speed * 360;
                this.el.object3D.rotation[this.data.axis] += THREE.MathUtils.degToRad(deg);
            }
        });

        // ── Hover glow: brightens material on raycaster hover ──
        AFRAME.registerComponent('zen-hover-glow', {
            init: function () {
                this.el.addEventListener('mouseenter', function () {
                    this.setAttribute('material', 'emissiveIntensity', 0.6);
                });
                this.el.addEventListener('mouseleave', function () {
                    this.setAttribute('material', 'emissiveIntensity', 0.2);
                });
            }
        });

        // ── Dynamic sky: shifts hue slowly for a living atmosphere ──
        AFRAME.registerComponent('zen-sky', {
            schema: {
                baseHue: { type: 'number', default: 30 },
                speed: { type: 'number', default: 0.003 }
            },
            init: function () {
                this.time = 0;
            },
            tick: function (t, dt) {
                this.time += (dt / 1000) * this.data.speed;
                var hue = this.data.baseHue + Math.sin(this.time) * 8;
                var sat = 35 + Math.sin(this.time * 0.7) * 5;
                var light = 18 + Math.sin(this.time * 0.5) * 3;
                var color = 'hsl(' + hue + ', ' + sat + '%, ' + light + '%)';
                this.el.setAttribute('material', 'color', color);
            }
        });

        // ── Firefly particles: organic floating lights ──
        AFRAME.registerComponent('fireflies', {
            schema: {
                count: { type: 'int', default: 30 },
                range: { type: 'number', default: 40 },
                color: { type: 'color', default: '#e8c9a0' }
            },
            init: function () {
                this.particles = [];
                for (var i = 0; i < this.data.count; i++) {
                    var sphere = document.createElement('a-sphere');
                    var x = (Math.random() - 0.5) * this.data.range;
                    var y = 1 + Math.random() * 6;
                    var z = (Math.random() - 0.5) * this.data.range;
                    var r = 0.02 + Math.random() * 0.04;
                    sphere.setAttribute('position', x + ' ' + y + ' ' + z);
                    sphere.setAttribute('radius', r);
                    sphere.setAttribute('material', {
                        color: this.data.color,
                        emissive: this.data.color,
                        emissiveIntensity: 0.8,
                        opacity: 0.3 + Math.random() * 0.4,
                        transparent: true
                    });
                    this.particles.push({
                        el: sphere,
                        baseY: y,
                        speed: 0.3 + Math.random() * 0.8,
                        amplitude: 0.3 + Math.random() * 0.6,
                        phase: Math.random() * Math.PI * 2,
                        fadeSpeed: 0.5 + Math.random() * 0.5,
                        fadePhase: Math.random() * Math.PI * 2
                    });
                    this.el.appendChild(sphere);
                }
                this.time = 0;
            },
            tick: function (t, dt) {
                this.time += dt / 1000;
                for (var i = 0; i < this.particles.length; i++) {
                    var p = this.particles[i];
                    var y = p.baseY + Math.sin(this.time * p.speed + p.phase) * p.amplitude;
                    p.el.object3D.position.y = y;
                    var opacity = 0.2 + Math.abs(Math.sin(this.time * p.fadeSpeed + p.fadePhase)) * 0.5;
                    p.el.setAttribute('material', 'opacity', opacity);
                }
            }
        });

        // ── Leaf fall: falling leaves effect ──
        AFRAME.registerComponent('falling-leaves', {
            schema: {
                count: { type: 'int', default: 15 },
                range: { type: 'number', default: 30 },
                fallSpeed: { type: 'number', default: 0.3 }
            },
            init: function () {
                this.leaves = [];
                var colors = ['#7aab6d', '#a0c48a', '#c4956a', '#d4a373', '#8b9e6b'];
                for (var i = 0; i < this.data.count; i++) {
                    var leaf = document.createElement('a-plane');
                    var x = (Math.random() - 0.5) * this.data.range;
                    var y = 5 + Math.random() * 10;
                    var z = (Math.random() - 0.5) * this.data.range;
                    leaf.setAttribute('width', 0.08 + Math.random() * 0.1);
                    leaf.setAttribute('height', 0.06 + Math.random() * 0.08);
                    leaf.setAttribute('position', x + ' ' + y + ' ' + z);
                    leaf.setAttribute('material', {
                        color: colors[Math.floor(Math.random() * colors.length)],
                        opacity: 0.6 + Math.random() * 0.3,
                        transparent: true,
                        side: 'double'
                    });
                    this.leaves.push({
                        el: leaf,
                        x: x,
                        baseY: y,
                        z: z,
                        swaySpeed: 0.5 + Math.random() * 1,
                        swayAmp: 0.3 + Math.random() * 0.5,
                        rotSpeed: 20 + Math.random() * 60,
                        fallSpeed: this.data.fallSpeed * (0.5 + Math.random() * 1),
                        phase: Math.random() * Math.PI * 2
                    });
                    this.el.appendChild(leaf);
                }
                this.time = 0;
            },
            tick: function (t, dt) {
                this.time += dt / 1000;
                for (var i = 0; i < this.leaves.length; i++) {
                    var l = this.leaves[i];
                    var y = l.el.object3D.position.y - l.fallSpeed * (dt / 1000);
                    if (y < -0.5) {
                        y = 8 + Math.random() * 6;
                        l.el.object3D.position.x = (Math.random() - 0.5) * this.data.range;
                        l.el.object3D.position.z = (Math.random() - 0.5) * this.data.range;
                    }
                    l.el.object3D.position.y = y;
                    l.el.object3D.position.x += Math.sin(this.time * l.swaySpeed + l.phase) * l.swayAmp * (dt / 1000);
                    l.el.object3D.rotation.x += THREE.MathUtils.degToRad(l.rotSpeed * (dt / 1000));
                    l.el.object3D.rotation.z += THREE.MathUtils.degToRad(l.rotSpeed * 0.7 * (dt / 1000));
                }
            }
        });

        // ── Water shimmer on flat planes ──
        AFRAME.registerComponent('water-shimmer', {
            schema: {
                speed: { type: 'number', default: 0.4 }
            },
            init: function () {
                this.time = 0;
            },
            tick: function (t, dt) {
                this.time += (dt / 1000) * this.data.speed;
                var opacity = 0.35 + Math.sin(this.time) * 0.08;
                this.el.setAttribute('material', 'opacity', opacity);
            }
        });
    </script>
</head>

<body>

    <!-- ══════════════════════════════════════════
         LOADING OVERLAY
         ══════════════════════════════════════════ -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Preparing your sanctuary…</div>
        <div class="loading-repo" id="loading-repo-name"></div>
        <div class="loading-subtitle">Zen Archipelago</div>
    </div>

    <!-- ══════════════════════════════════════════
         REPO INFO PANEL (HUD — top left)
         ══════════════════════════════════════════ -->
    <div id="repo-hud" class="hidden">
        <div class="hud-eyebrow">Zen Explorer</div>
        <div class="hud-repo-name" id="hud-repo-name">Zen Archipelago</div>
        <div class="hud-desc" id="hud-desc">Explore data across floating islands</div>
        <div class="hud-stats">
            <div class="hud-stat">
                <div class="hud-stat-value" id="hud-stars">—</div>
                <div class="hud-stat-label">Stars</div>
            </div>
            <div class="hud-stat">
                <div class="hud-stat-value" id="hud-forks">—</div>
                <div class="hud-stat-label">Forks</div>
            </div>
            <div class="hud-stat">
                <div class="hud-stat-value" id="hud-issues">—</div>
                <div class="hud-stat-label">Issues</div>
            </div>
            <div class="hud-stat">
                <div class="hud-stat-value" id="hud-lang">—</div>
                <div class="hud-stat-label">Language</div>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════
         SESSION BADGE (HUD — top right)
         ══════════════════════════════════════════ -->
    <div id="session-badge">
        <div class="badge-room" id="badge-room">—</div>
        <div class="badge-time" id="badge-time">--:--</div>
        <div class="badge-date" id="badge-date">Loading...</div>
        <div class="badge-session">
            <span class="session-dot"></span>
            Session: <span id="badge-session">0:00</span>
        </div>
    </div>

    <!-- ══════════════════════════════════════════
         ISLAND INDICATOR (Bottom center)
         ══════════════════════════════════════════ -->
    <div id="island-indicator">
        <span class="island-name">Central Sanctuary</span>
        <span class="island-dot active" data-island="central"></span>
        <span class="island-dot" data-island="languages"></span>
        <span class="island-dot" data-island="contributors"></span>
        <span class="island-dot" data-island="metrics"></span>
    </div>

    <!-- Back to Lobby -->
    <a id="back-lobby" href="javascript:void(0)">
        ← Back to Lobby
    </a>

    <!-- ══════════════════════════════════════════
         A-FRAME SCENE
         ══════════════════════════════════════════ -->
    <a-scene id="zen-scene" renderer="antialias: true; colorManagement: true; sortObjects: true"
        fog="type: exponential; color: #2a2218; density: 0.012">

        <a-assets>
            <a-asset-item id="font-exo" src="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-asset-item>
        </a-assets>

        <!-- ==================== SKY — Warm Dynamic Gradient ==================== -->
        <a-sky zen-sky="baseHue: 28; speed: 0.004"
            material="shader: flat; color: #2d1f14; side: back"></a-sky>

        <!-- Subtle horizon glow (warm sunrise/sunset feel) -->
        <a-circle position="0 0 -120" radius="80" rotation="0 0 0"
            material="shader: flat; color: #c4784a; opacity: 0.06; transparent: true; side: double"></a-circle>

        <!-- ==================== WATER — Zen Ocean ==================== -->
        <a-plane id="zen-water" position="0 -0.3 0" rotation="-90 0 0" width="300" height="300"
            material="color: #3a5f6f; opacity: 0.4; transparent: true; metalness: 0.7; roughness: 0.2; side: double"
            water-shimmer="speed: 0.6"></a-plane>

        <!-- Water surface detail rings -->
        <a-ring position="0 -0.28 0" rotation="-90 0 0" radius-inner="22" radius-outer="22.3"
            material="color: #5b8fa8; opacity: 0.08; transparent: true; side: double"
            animation="property: scale; from: 1 1 1; to: 1.3 1.3 1; dur: 8000; easing: easeInOutSine; loop: true; dir: alternate"></a-ring>
        <a-ring position="0 -0.28 0" rotation="-90 0 0" radius-inner="35" radius-outer="35.2"
            material="color: #5b8fa8; opacity: 0.05; transparent: true; side: double"
            animation="property: scale; from: 1 1 1; to: 1.15 1.15 1; dur: 12000; easing: easeInOutSine; loop: true; dir: alternate"></a-ring>

        <!-- ==================== LIGHTING — Warm Golden Hour ==================== -->

        <!-- Main ambient — warm & soft -->
        <a-light type="ambient" intensity="0.55" color="#ffe8cc"></a-light>

        <!-- Sun — low angle, golden -->
        <a-light id="sun-light" type="directional" intensity="0.6" position="15 25 -20" color="#ffd6a5"
            castShadow="false"></a-light>

        <!-- Fill light from opposite side (cool, subtle) -->
        <a-light type="directional" intensity="0.15" position="-10 10 15" color="#a8c8d8"></a-light>

        <!-- Warm accent spotlights on each island -->
        <a-light type="spot" intensity="0.5" color="#c4956a" position="0 12 0" angle="50"
            penumbra="1" distance="25" decay="1.5"></a-light>
        <a-light type="spot" intensity="0.4" color="#c4956a" position="0 14 -22" angle="40"
            penumbra="1" distance="25" decay="1.5" target="#island-languages"></a-light>
        <a-light type="spot" intensity="0.4" color="#c4956a" position="-22 14 14" angle="40"
            penumbra="1" distance="25" decay="1.5" target="#island-contributors"></a-light>
        <a-light type="spot" intensity="0.4" color="#c4956a" position="22 14 14" angle="40"
            penumbra="1" distance="25" decay="1.5" target="#island-metrics"></a-light>

        <!-- ==================== NATURAL EFFECTS ==================== -->

        <!-- Fireflies (warm dust motes in sunlight) -->
        <a-entity fireflies="count: 40; range: 50; color: #e8c9a0"></a-entity>

        <!-- Falling leaves -->
        <a-entity falling-leaves="count: 18; range: 40; fallSpeed: 0.25"></a-entity>


        <!-- ══════════════════════════════════════════════════════════
             CENTRAL ISLAND — Sanctuary / Spawn Point
             ══════════════════════════════════════════════════════════ -->
        <a-entity id="island-central" position="0 0 0">

            <!-- Main landmass — layered organic stone -->
            <a-cylinder position="0 -0.1 0" radius="12" height="1.4"
                material="color: #8b7355; roughness: 0.95; metalness: 0"></a-cylinder>
            <a-cylinder position="0 0.4 0" radius="10.5" height="0.6"
                material="color: #6b8f5e; roughness: 0.9; metalness: 0"></a-cylinder>
            <!-- Grass/moss top layer -->
            <a-cylinder position="0 0.71 0" radius="10.2" height="0.02"
                material="color: #5a7a4e; roughness: 1; metalness: 0"></a-cylinder>

            <!-- Stone border ring -->
            <a-torus position="0 0.3 0" rotation="90 0 0" radius="11" radius-tubular="0.25"
                material="color: #9e8c72; roughness: 0.85; metalness: 0.1"></a-torus>

            <!-- Decorative rocks on central island -->
            <a-sphere position="6 0.9 -3" radius="0.6"
                material="color: #a09080; roughness: 0.9; metalness: 0" scale="1 0.7 1"></a-sphere>
            <a-sphere position="7 0.8 -2.5" radius="0.35"
                material="color: #b0a090; roughness: 0.85; metalness: 0" scale="1 0.6 0.8"></a-sphere>
            <a-sphere position="-5 0.85 4" radius="0.5"
                material="color: #908070; roughness: 0.9; metalness: 0" scale="1.2 0.65 1"></a-sphere>
            <a-sphere position="-6 0.8 3.5" radius="0.3"
                material="color: #a09585; roughness: 0.85; metalness: 0" scale="1 0.7 0.9"></a-sphere>

            <!-- Zen rock garden in the center (flat polished stones) -->
            <a-cylinder position="0 0.73 0" radius="3.5" height="0.04"
                material="color: #c8b99a; roughness: 0.7; metalness: 0; opacity: 0.9; transparent: true"></a-cylinder>
            <!-- Raked sand circles -->
            <a-ring position="0 0.76 0" rotation="-90 0 0" radius-inner="1.2" radius-outer="1.3"
                material="color: #d4c5a9; opacity: 0.4; transparent: true; side: double"
                zen-rotate="speed: 0.005"></a-ring>
            <a-ring position="0 0.76 0" rotation="-90 0 0" radius-inner="2.0" radius-outer="2.08"
                material="color: #d4c5a9; opacity: 0.35; transparent: true; side: double"
                zen-rotate="speed: -0.003"></a-ring>
            <a-ring position="0 0.76 0" rotation="-90 0 0" radius-inner="2.7" radius-outer="2.76"
                material="color: #d4c5a9; opacity: 0.3; transparent: true; side: double"
                zen-rotate="speed: 0.004"></a-ring>

            <!-- Central zen stones (classic 3-stone arrangement) -->
            <a-sphere position="0 1 0" radius="0.35"
                material="color: #5a5045; roughness: 0.6; metalness: 0.15" scale="1 1.3 0.8"></a-sphere>
            <a-sphere position="-0.6 0.85 0.3" radius="0.22"
                material="color: #6a6055; roughness: 0.65; metalness: 0.1" scale="1 1.1 0.9"></a-sphere>
            <a-sphere position="0.5 0.82 -0.2" radius="0.18"
                material="color: #706558; roughness: 0.7; metalness: 0.1" scale="0.9 1 1"></a-sphere>

            <!-- Bamboo stalks (decorative vertical elements) -->
            <a-cylinder position="8 2.5 0" radius="0.08" height="4"
                material="color: #7a9a5a; roughness: 0.7; metalness: 0.1"></a-cylinder>
            <a-cylinder position="8.3 2.2 0.3" radius="0.06" height="3.5"
                material="color: #8aaa68; roughness: 0.7; metalness: 0.1"></a-cylinder>
            <a-cylinder position="8.1 2 -0.2" radius="0.05" height="3"
                material="color: #6a8a4a; roughness: 0.7; metalness: 0.1"></a-cylinder>

            <a-cylinder position="-7 2.3 -2" radius="0.07" height="3.8"
                material="color: #7a9a5a; roughness: 0.7; metalness: 0.1"></a-cylinder>
            <a-cylinder position="-7.3 2 -2.3" radius="0.055" height="3"
                material="color: #8aaa68; roughness: 0.7; metalness: 0.1"></a-cylinder>

            <!-- Small bushes (spheres as foliage) -->
            <a-sphere position="5 1.1 5" radius="0.8"
                material="color: #5a7a4e; roughness: 1; metalness: 0; opacity: 0.9; transparent: true"
                scale="1.2 0.8 1"></a-sphere>
            <a-sphere position="5.5 1 5.3" radius="0.5"
                material="color: #6a8a5e; roughness: 1; metalness: 0; opacity: 0.85; transparent: true"
                scale="1 0.7 0.9"></a-sphere>
            <a-sphere position="-8 1.1 -4" radius="0.7"
                material="color: #4a6a3e; roughness: 1; metalness: 0; opacity: 0.85; transparent: true"
                scale="1.1 0.75 1"></a-sphere>

            <!-- Welcome Title — floating above central stones -->
            <a-entity id="scene-title" position="0 4.5 0" zen-float="amplitude: 0.1; speed: 0.5">
                <a-text value="Zen Archipelago" position="0 0.6 0" align="center" color="#e8c9a0" width="10"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" opacity="0.85" side="double"
                    look-at="[camera]"></a-text>
                <a-text id="scene-repo-name" value="" position="0 -0.1 0" align="center" color="#faf5eb" width="7"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" opacity="0.9" side="double"
                    look-at="[camera]"></a-text>
                <a-text id="scene-subtitle" value="explore · discover · understand" position="0 -0.6 0"
                    align="center" color="#8a7e65" width="5" opacity="0.6" side="double"
                    look-at="[camera]"></a-text>
            </a-entity>

        </a-entity>


        <!-- ══════════════════════════════════════════════════════════
             STEPPING STONES — Bridges between islands
             ══════════════════════════════════════════════════════════ -->

        <!-- Path to Languages Island (north) -->
        <a-entity id="path-to-languages">
            <a-cylinder position="0 0.3 -13" radius="0.7" height="0.5"
                material="color: #9e8c72; roughness: 0.8" zen-float="amplitude: 0.03; speed: 0.8; phase: 0"></a-cylinder>
            <a-cylinder position="-0.5 0.25 -15" radius="0.55" height="0.45"
                material="color: #a89a80; roughness: 0.85" zen-float="amplitude: 0.04; speed: 0.7; phase: 1"></a-cylinder>
            <a-cylinder position="0.3 0.2 -17" radius="0.6" height="0.4"
                material="color: #8e7e62; roughness: 0.8" zen-float="amplitude: 0.035; speed: 0.9; phase: 2"></a-cylinder>
            <a-cylinder position="-0.2 0.22 -19" radius="0.5" height="0.42"
                material="color: #9e8c72; roughness: 0.85" zen-float="amplitude: 0.04; speed: 0.75; phase: 3"></a-cylinder>
        </a-entity>

        <!-- Path to Contributors Island (southwest) -->
        <a-entity id="path-to-contributors">
            <a-cylinder position="-10 0.28 6" radius="0.6" height="0.45"
                material="color: #9e8c72; roughness: 0.8" zen-float="amplitude: 0.03; speed: 0.85; phase: 0.5"></a-cylinder>
            <a-cylinder position="-12.5 0.22 8" radius="0.55" height="0.4"
                material="color: #a89a80; roughness: 0.85" zen-float="amplitude: 0.04; speed: 0.7; phase: 1.5"></a-cylinder>
            <a-cylinder position="-15 0.18 10" radius="0.5" height="0.38"
                material="color: #8e7e62; roughness: 0.8" zen-float="amplitude: 0.035; speed: 0.9; phase: 2.5"></a-cylinder>
            <a-cylinder position="-17 0.2 12" radius="0.55" height="0.42"
                material="color: #9e8c72; roughness: 0.85" zen-float="amplitude: 0.04; speed: 0.8; phase: 3.5"></a-cylinder>
        </a-entity>

        <!-- Path to Metrics Island (southeast) -->
        <a-entity id="path-to-metrics">
            <a-cylinder position="10 0.28 6" radius="0.6" height="0.45"
                material="color: #9e8c72; roughness: 0.8" zen-float="amplitude: 0.03; speed: 0.75; phase: 1"></a-cylinder>
            <a-cylinder position="12.5 0.22 8" radius="0.5" height="0.4"
                material="color: #a89a80; roughness: 0.85" zen-float="amplitude: 0.04; speed: 0.85; phase: 2"></a-cylinder>
            <a-cylinder position="15 0.18 10" radius="0.55" height="0.38"
                material="color: #8e7e62; roughness: 0.8" zen-float="amplitude: 0.035; speed: 0.7; phase: 3"></a-cylinder>
            <a-cylinder position="17 0.2 12" radius="0.6" height="0.42"
                material="color: #9e8c72; roughness: 0.85" zen-float="amplitude: 0.04; speed: 0.9; phase: 4"></a-cylinder>
        </a-entity>

    <!-- ══════════════════════════════════════════
         SCENE LOGIC
         ══════════════════════════════════════════ -->
    <script>
        // ═══════════════════════════════════════════════════════════
        //  ZEN ARCHIPELAGO — Scene Initialization Logic
        // ═══════════════════════════════════════════════════════════

        document.addEventListener('DOMContentLoaded', function () {

            var scene = document.getElementById('zen-scene');

            // ── Hide loading overlay when scene is ready ──
            scene.addEventListener('loaded', function () {
                setTimeout(function () {
                    var overlay = document.getElementById('loading-overlay');
                    if (overlay) {
                        overlay.classList.add('fade-out');
                        setTimeout(function () { overlay.style.display = 'none'; }, 1200);
                    }
                    // Show HUD
                    var hud = document.getElementById('repo-hud');
                    if (hud) hud.classList.remove('hidden');
                }, 800);
            });

            // ── Clock update ──
            function updateClock() {
                var now = new Date();
                var time = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                var date = now.toLocaleDateString('es-ES', {
                    weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
                });
                var timeEl = document.getElementById('badge-time');
                var dateEl = document.getElementById('badge-date');
                if (timeEl) timeEl.textContent = time;
                if (dateEl) dateEl.textContent = date;
            }
            updateClock();
            setInterval(updateClock, 30000);

            // ── Session timer ──
            var sessionStart = Date.now();
            setInterval(function () {
                var elapsed = Math.floor((Date.now() - sessionStart) / 1000);
                var mins = Math.floor(elapsed / 60);
                var secs = String(elapsed % 60);
                if (secs.length < 2) secs = '0' + secs;
                var el = document.getElementById('badge-session');
                if (el) el.textContent = mins + ':' + secs;
            }, 1000);

            // ── Island indicator logic ──
            var islands = [
                { id: 'central', pos: { x: 0, z: 0 }, name: 'Central Sanctuary' },
                { id: 'languages', pos: { x: 0, z: -24 }, name: 'Languages Island' },
                { id: 'contributors', pos: { x: -20, z: 16 }, name: 'Contributors Island' },
                { id: 'metrics', pos: { x: 20, z: 16 }, name: 'Metrics Island' }
            ];

            function getClosestIsland(playerPos) {
                var closest = islands[0];
                var minDist = Infinity;
                for (var i = 0; i < islands.length; i++) {
                    var island = islands[i];
                    var dx = playerPos.x - island.pos.x;
                    var dz = playerPos.z - island.pos.z;
                    var dist = Math.sqrt(dx * dx + dz * dz);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = island;
                    }
                }
                return closest;
            }

            var lastIslandId = 'central';
            setInterval(function () {
                var rig = document.getElementById('rig');
                if (!rig) return;
                var pos = rig.object3D.position;
                var closest = getClosestIsland(pos);
                if (closest.id !== lastIslandId) {
                    lastIslandId = closest.id;
                    // Update indicator dots
                    var dots = document.querySelectorAll('.island-dot');
                    for (var i = 0; i < dots.length; i++) {
                        if (dots[i].dataset.island === closest.id) {
                            dots[i].classList.add('active');
                        } else {
                            dots[i].classList.remove('active');
                        }
                    }
                    // Update island name
                    var nameEl = document.querySelector('.island-name');
                    if (nameEl) nameEl.textContent = closest.name;
                }
            }, 500);

        });
    </script>
